<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Srishti Gangolly — about</title>
<meta name="theme-color" content="#76BA9D">
<link rel="icon" href="img/doodle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Fraunces:ital,wght@1,800;1,900&amp;family=Pixelify+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#97051D}a:hover{color:#04361D}
.win{background:#F0F2D5;border:3px solid #04361D;box-shadow:6px 6px 0 #04361D;display:flex;flex-direction:column;min-width:0}
.bar{height:36px;flex:none;background:#04361D;color:#F0F2D5;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;font-family:'Pixelify Sans',monospace;font-size:16px;font-weight:600}
.close{width:28px;height:28px;box-sizing:border-box;border:2px solid #F0F2D5;background:#F0F2D5;display:inline-flex;align-items:center;justify-content:center}
.close:hover{background:#EF233C}
.h2{margin:0;font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:clamp(36px,4.4vw,52px);line-height:1.05;color:#6B0314}
.label{font-family:'Pixelify Sans',monospace;font-size:14px;letter-spacing:.1em;color:#97051D}
.p{margin:0;font-size:15px;line-height:1.75}
.ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.pane{border:3px solid #04361D;background:#FFFFF4;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.navrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:'Pixelify Sans',monospace;font-size:16px}
.navrow a{color:#04361D}
.px{image-rendering:pixelated;shape-rendering:crispEdges}
.btn{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:lowercase;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:6px 12px;border:3px solid #04361D;box-sizing:border-box;box-shadow:0 4px 0 #04361D}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #04361D}
.info{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding:28px;align-items:start}
@media (max-width:860px){.info{grid-template-columns:minmax(0,1fr)}}
.card{border:3px solid #04361D;background:#FFFFF4;box-shadow:4px 4px 0 #97051D;padding:22px 20px;display:flex;flex-direction:column;align-items:stretch;gap:18px}
.strip{position:relative;align-self:center;width:170px;box-sizing:border-box;margin:10px 0 2px;background:#141414;border:3px solid #04361D;box-shadow:5px 5px 0 #97051D;padding:12px 12px 4px;transform:rotate(-2deg);display:flex;flex-direction:column}
.strip img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:0;box-sizing:border-box}
.strip figcaption{font-family:'Pixelify Sans',monospace;font-size:14px;color:#E4E7C3;text-align:center;padding:5px 0 9px}
.strip .tape{position:absolute;top:-10px;left:50%;width:56px;height:16px;transform:translateX(-50%) rotate(3deg);background:#76BA9D;border:2px solid #04361D}
.photo{align-self:center;width:150px;height:150px;box-sizing:border-box;border:3px solid #04361D;background:#76BA9D;background-image:radial-gradient(#6AAE91 1px,transparent 1.2px);background-size:8px 8px;display:flex;align-items:center;justify-content:center}
.photo img{width:120px;height:auto;transform:rotate(6deg)}
.facts{margin:0;display:flex;flex-direction:column;border-top:2px dashed #04361D}
.fact{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:9px 0;border-bottom:2px dashed #04361D;font-size:13px;line-height:1.5}
.fact dt{font-family:'Pixelify Sans',monospace;font-size:14px;color:#97051D}
.fact dd{margin:0}
.live{display:inline-block;width:8px;height:8px;background:#3FA66B;border:2px solid #04361D;margin-right:6px;vertical-align:1px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.tabs{display:flex;gap:6px;padding-left:12px}
.tab{font-family:'Pixelify Sans',monospace;font-size:16px;font-weight:600;color:#04361D;border:3px solid #04361D;border-bottom:0;padding:8px 16px;cursor:pointer;margin-bottom:-3px;position:relative}
.tab[aria-selected="true"]{z-index:1}
.tab:focus-visible{outline:3px solid #97051D;outline-offset:2px}
.sheet{border:3px solid #04361D;background:#FFFFF4;padding:28px 30px 32px;display:flex;flex-direction:column;gap:20px;min-height:520px}
.timeline{list-style:none;margin:0;padding:0 0 0 26px;border-left:3px solid #04361D;display:flex;flex-direction:column;gap:26px}
.step{position:relative;display:flex;flex-direction:column;gap:8px}
.dot{position:absolute;left:-37px;top:9px;width:14px;height:14px;background:#EF233C;border:3px solid #04361D}
.step-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.step-head h3{margin:0;font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:30px;line-height:1.1;color:#6B0314}
.when{font-family:'Pixelify Sans',monospace;font-size:14px;color:#2E5A43}
.stats{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:#04361D;color:#F0F2D5;border:3px solid #04361D;box-shadow:3px 3px 0 #97051D;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.stat-num{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:24px;line-height:1.1;color:#F2B33D}
.stat-name{font-family:'Pixelify Sans',monospace;font-size:13px}
.role{align-self:flex-start;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:18px;line-height:1.3}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:14px;line-height:1.5}
.rows li{padding:7px 0 7px 18px;border-bottom:2px dashed rgba(4,54,29,.3);position:relative}
.rows li::before{content:"";position:absolute;left:2px;top:14px;width:7px;height:7px;background:#EF233C}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{font-family:'Pixelify Sans',monospace;font-size:13px;padding:1px 8px;border:2px solid #04361D;background:#76BA9D}
.quote{margin:0;position:relative;border:3px solid #04361D;background:#F0F2D5;box-shadow:5px 5px 0 #04361D;padding:30px 28px 20px 28px;display:flex;flex-direction:column;gap:12px}
.qmark{position:absolute;top:-17px;left:20px;background:#FFFFF4;padding:0 6px;transform:rotate(180deg)}
.quote blockquote{margin:0;font-family:'Fraunces',serif;font-style:italic;font-weight:800;font-size:22px;line-height:1.55;color:#04361D}
.quote mark{background:linear-gradient(transparent 55%,#A8D4BF 55%);color:inherit;padding:0 2px}
.quote figcaption{align-self:flex-end;font-family:'Pixelify Sans',monospace;font-size:16px;color:#97051D}
.photo-card{margin:10px 0 4px;align-self:center;max-width:280px;background:#FFFFF4;border:3px solid #04361D;box-shadow:5px 5px 0 #97051D;padding:10px 10px 8px;transform:rotate(2deg);display:flex;flex-direction:column;gap:8px}
.photo-card img{display:block;width:100%;height:auto;border:2px solid #04361D}
.photo-card figcaption{font-family:'Pixelify Sans',monospace;font-size:14px;text-align:center}
.photo-pair{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:34px;margin:10px 0 20px}
.photo-pair .photo-card{margin:0;align-self:auto;width:150px;padding:7px 7px 6px}
.photo-pair .photo-card figcaption{font-size:12px}
.collage{position:relative;align-self:center;width:100%;max-width:340px;box-sizing:border-box;margin:22px 0 4px;background:#141414;border:3px solid #04361D;box-shadow:5px 5px 0 #97051D;padding:12px 12px 10px;transform:rotate(-2deg);display:flex;flex-direction:column;gap:10px}
.collage img{display:block;width:100%;height:auto;border:0;box-sizing:border-box}
.collage figcaption{font-family:'Pixelify Sans',monospace;font-size:14px;color:#E4E7C3;text-align:center}
.collage .tape{position:absolute;top:-10px;left:50%;width:64px;height:18px;transform:translateX(-50%) rotate(3deg);background:#76BA9D;border:2px solid #04361D}
.nows{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.nows .now{flex:0 1 calc(50% - 7px);box-sizing:border-box;min-width:220px}
.now{border:3px solid #04361D;background:#F0F2D5;box-shadow:3px 3px 0 #04361D;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.menubar{height:32px;flex:none;width:100%;box-sizing:border-box;background:#F0F2D5;border-bottom:3px solid #04361D;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:'Pixelify Sans',monospace;font-size:15px;position:sticky;top:0;z-index:6}
.menubar .menus{display:flex;align-items:center;gap:18px}
.menubar .menus a{color:#04361D;text-decoration:none;padding:2px 6px}
.menubar .menus a:hover{background:#04361D;color:#F0F2D5}
.menubar .tray{display:flex;align-items:center;gap:22px}
.crt{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(rgba(4,54,29,.05) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 140px rgba(4,54,29,.28)}
@media (max-width:700px){.menubar .menus .opt{display:none}}
@media (max-width:480px){.menubar{padding:0 10px;font-size:13px}.menubar .tray{gap:10px}.menubar .tray svg{width:14px;height:auto}}

/* phones: everything a little smaller and tighter; full-height blocks are scaled back up to fill the screen */
@media (max-width:560px){
  body{zoom:.88}
  footer [style*="gap: 12px; margin-top: 6px"]{justify-content:center}
  /* same footer on every page: no fixed heights */
  footer,footer > div{height:auto!important}
  /* footer: no "leave me a note" envelope on phones */
  footer .note-link{display:none!important}
  .strip{width:140px!important;padding:10px 10px 4px!important}
  [style*="min-height: 100vh"],.desk-root{min-height:calc(100dvh / .88)!important}
}
.home-btn{display:none}
/* phones: a little home button in the menu bar instead of the "back to desktop" link */
@media (max-width:560px){
  .home-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:24px;margin-left:4px;border:2px solid #04361D;background:#F0F2D5;box-shadow:2px 2px 0 #04361D}
  .home-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #04361D}
  .navrow a[href="desktop.html"],.navrow a[href="Home.dc.html"]{display:none}
}
</style>
<script src="js/srishti-os.js"></script>
</head>
<body>
<div id="app"></div>
<template id="page">
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; background-color: #76BA9D; background-image: radial-gradient(#6AAE91 1px, transparent 1.2px); background-size: 8px 8px; font-family: 'DM Mono', monospace; color: #04361D; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px 16px 0; position: relative">
  <header class="menubar" style="margin: -24px -16px 0; width: calc(100% + 32px)">
    <nav class="menus" aria-label="menu">
      <span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 6px">
        <svg class="px" viewBox="0 0 11 16" width="11" height="16" aria-hidden="true"><path fill="#EF233C" d="M2 0h1v1H2zM5 0h1v1H5zM8 0h1v1H8zM2 1h7v1H2zM2 2h7v3H2zM3 5h5v1H3zM4 6h3v1H4z"/><path fill="#97051D" d="M5 2h1v4H5zM8 2h1v3H8z"/><path fill="#04361D" d="M5 7h1v9H5zM1 9h1v2H1zM2 11h1v1H2zM3 12h2v1H3zM9 8h1v2H9zM8 10h1v1H8zM6 11h2v1H6z"/><path fill="#76BA9D" d="M2 9h1v2H2zM3 11h2v1H3zM8 8h1v2H8zM6 10h2v1H6z"/></svg>
        srishti os
      </span>
      <a class="home-btn" href="desktop.html" aria-label="home: back to the desktop" title="desktop"><svg class="px" viewBox="0 0 10 9" width="15" height="14" aria-hidden="true"><path fill="#04361D" d="M4 0h2v1H4zM3 1h4v1H3zM2 2h6v1H2zM1 3h8v1H1zM0 4h10v1H0zM1 5h3v4H1zM6 5h3v4H6zM4 5h2v1H4z"/></svg></a>
    </nav>
    <div class="tray">
      <svg class="px" viewBox="0 0 9 7" width="18" height="14" aria-label="wifi" role="img"><path fill="#04361D" d="M2 0h5v1H2zM1 1h1v1H1zM7 1h1v1H7zM0 2h1v1H0zM8 2h1v1H8zM3 2h3v1H3zM2 3h1v1H2zM6 3h1v1H6zM4 5h1v2H4z"/></svg>
      <svg class="px" viewBox="0 0 12 7" width="24" height="14" aria-label="battery full" role="img"><path fill="#04361D" d="M0 0h10v1H0zM0 6h10v1H0zM0 1h1v5H0zM9 1h1v5H9zM10 2h2v3h-2z"/><path fill="#EF233C" d="M2 2h6v3H2z"/></svg>
      <time style="white-space: pre; word-spacing: 2px">{{clock}}</time>
    </div>
  </header>

  <a href="desktop.html" aria-label="back to desktop" style="line-height: 0"><img src="img/doodle.png" alt="Srishti Gangolly" style="width: 92px; height: auto; transform: rotate(6deg)"></a>

  <main class="win" style="width: 100%; max-width: 1120px">
    <div class="bar">
      <span>about_me.txt</span>
      <a class="close" href="desktop.html" aria-label="close, back to desktop"><svg class="px" viewBox="0 0 8 8" width="12" height="12" aria-hidden="true"><path fill="#04361D" d="M0 0h2v1H0zM6 0h2v1H6zM1 1h2v1H1zM5 1h2v1H5zM2 2h4v1H2zM3 3h2v2H3zM2 5h4v1H2zM1 6h2v1H1zM5 6h2v1H5zM0 7h2v1H0zM6 7h2v1H6z"/></svg></a>
    </div>
    <div class="info">
      <!-- left: the "get info" card -->
      <aside class="card" aria-label="profile">
        <figure class="strip">
          <span class="tape" aria-hidden="true"></span>
          <img src="img/site/me-2009.png" alt="srishti in 2009: a little kid in a navy bucket hat hugging a lavender teddy bear">
          <figcaption>2009</figcaption>
          <img src="img/site/me-2026.png" alt="srishti in 2026: a smiling selfie with shoulder-length dark hair">
          <figcaption>2026</figcaption>
        </figure>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 900; font-size: 30px; line-height: 1.1; color: #6B0314">srishti gangolly</h1>
        </div>
        <dl class="facts">
            <div class="fact"><dt>where</dt><dd>toronto, ontario</dd></div>
            <div class="fact"><dt>studying</dt><dd>b.sc. applied math, geospatial data science &amp; statistics @ uoft</dd></div>
            <div class="fact"><dt>into</dt><dd>martech &amp; gtm, growth, product, data</dd></div>
            <div class="fact"><dt>status</dt><dd><span class="live" aria-hidden="true"></span>open to new roles</dd></div>
        </dl>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center">
          <a class="btn" href="https://drive.google.com/file/d/1dasPUW3PCfL3X46S7Zs5TBzfl2K2QQfY/view?usp=sharing" style="background: #04361D; color: #F0F2D5">resume ↗</a>
          <a class="btn" href="https://www.linkedin.com/in/srishti-gangolly/" style="background: #F0F2D5; color: #04361D">linkedin ↗</a>
        </div>
      </aside>

      <!-- right: tabbed story -->
      <section style="display: flex; flex-direction: column; min-width: 0">
        <div class="tabs" role="tablist" aria-label="about me">
          <button type="button" role="tab" class="tab" aria-selected="{{resumeSel}}" style="background: {{resumeBg}}" onClick="{{showResume}}">for the resume</button>
          <button type="button" role="tab" class="tab" aria-selected="{{beyondSel}}" style="background: {{beyondBg}}" onClick="{{showBeyond}}">beyond the resume</button>
        </div>
        <div class="sheet" role="tabpanel">
          <sc-if value="{{onResume}}" hint-placeholder-val="{{ true }}">
            <h2 class="h2">for the resume.</h2>
            <ol class="timeline">
                <li class="step">
                  <span class="dot" aria-hidden="true"></span>
                  <div class="step-head"><h3>uoft</h3><span class="when">studying</span></div>
                  <p class="p">i'm currently completing a bachelor of science in applied mathematics with geospatial data science and statistics at the university of toronto. beyond lectures and problem sets, i've consistently gravitated toward roles where i could build and connect:</p><ul class="ul"><li>marketing associate at google developer student club (gdsc)</li><li>director of marketing &amp; partnerships at mathematical and computational sciences society (mcss)</li><li>marketing project manager at innovative business association (iba)</li></ul><p class="p">the roles evolved, but the core never changed: build visibility, create impact, and foster the right relationships.</p>
                </li>
                <li class="step">
                  <span class="dot" aria-hidden="true"></span>
                  <div class="step-head"><h3>deerhacks</h3><span class="when">mcss · 2022 — 2024</span></div>
                  <ul class="stats"><li class="stat"><span class="stat-num">1,500+</span><span class="stat-name">applicants</span></li><li class="stat"><span class="stat-num">35+</span><span class="stat-name">events</span></li><li class="stat"><span class="stat-num">$15K+</span><span class="stat-name">budget</span></li><li class="stat"><span class="stat-num">3,000+</span><span class="stat-name">followers</span></li></ul><ul class="rows"><li>36-hour hackathon run through mcss</li><li>organized 2 iterations — deerhacks iii stood out most</li><li>community built from scratch</li><li>🏆 named best event of the year (kudos to the whole team!)</li></ul><figure class="photo-card"><img src="img/site/dh3-team-photo.jpg" alt="the deerhacks organizing team in matching deerhacks t-shirts, posing under a purple #DareToGlow neon sign"><figcaption>the deerhacks team ♡</figcaption></figure>
                </li>
                <li class="step">
                  <span class="dot" aria-hidden="true"></span>
                  <div class="step-head"><h3>vosyn ai</h3><span class="when">summer 2024</span></div>
                  <span class="role">data analytics &amp; strategy intern</span><ul class="rows"><li>dug into google analytics to understand user &amp; investor behavior</li><li>built tableau dashboards for real-time kpi tracking</li><li>worked with business development &amp; ui/ux teams on growth-focused recommendations</li></ul><div class="tools"><span class="tool">tableau</span><span class="tool">sql</span><span class="tool">product analytics</span><span class="tool">marketing analytics</span><span class="tool">project management</span><span class="tool">marketing strategy</span><span class="tool">data visualization</span><span class="tool">kpi reporting</span></div>
                </li>
                <li class="step">
                  <span class="dot" aria-hidden="true"></span>
                  <div class="step-head"><h3>intuit canada</h3><span class="when">2024 — 2025</span></div>
                  <span class="role">digital enablement &amp; data activation intern · turbotax</span><ul class="stats" style="grid-template-columns: minmax(0, 160px)"><li class="stat"><span class="stat-num">5M+</span><span class="stat-name">user base</span></li></ul><ul class="rows"><li>optimized data integration across customer data platforms &amp; mobile attribution</li><li>built custom audiences in segment &amp; braze</li><li>deployed kochava smartlinks for faster stakeholder insights</li><li>led standardization of data organization across marketing teams</li></ul><div class="photo-pair"><figure class="photo-card" style="transform: rotate(-3deg)"><img src="img/site/intuit-wall.jpg" alt="srishti holding up her intuit badge and pointing at the intuit, turbotax, credit karma, quickbooks and mailchimp logo wall"><figcaption>badge secured ✌</figcaption></figure><figure class="photo-card" style="transform: rotate(2deg)"><img src="img/site/intuit-desk.jpg" alt="a laptop open to the turbotax site on a desk by floor-to-ceiling windows overlooking the cn tower"><figcaption>office views</figcaption></figure></div><div class="tools"><span class="tool">data integration</span><span class="tool">growth marketing</span><span class="tool">kochava</span><span class="tool">marketing analytics</span><span class="tool">audience segmentation</span><span class="tool">project management</span><span class="tool">segment cdp</span><span class="tool">claravine</span><span class="tool">quality assurance</span><span class="tool">mobile attribution</span><span class="tool">braze</span></div>
                </li>
            </ol>
          </sc-if>
          <sc-if value="{{onBeyond}}" hint-placeholder-val="{{ false }}">
            <h2 class="h2">beyond the resume.</h2>
            <figure class="quote">
              <svg class="px qmark" viewBox="0 0 9 6" width="45" height="30" aria-hidden="true"><path fill="#EF233C" d="M0 0h3v3H0zM5 0h3v3H5zM1 3h2v1H1zM6 3h2v1H6zM2 4h1v2H2zM7 4h1v2H7z"/></svg>
              <blockquote>curiosity has never really been separate from the way i work. at the end of the day, i care about <mark>leading with intention</mark> and showing up with <mark>structure</mark>, <mark>creativity</mark>, and <mark>a genuine desire to learn</mark>, whatever problem is on the table.</blockquote>
              <figcaption>— srishti</figcaption>
            </figure>
            <figure class="collage"><span class="tape" aria-hidden="true"></span><img src="img/site/life-lately.jpg" alt="a taped-up photo collage: two matcha lattes with pastries, black-and-white photobooth strips with a friend, three friends posing together, and a palm-lined street with family in saris"><figcaption>life lately ♡</figcaption></figure>
            <span class="label" style="margin-top: 10px">currently</span>
            <ul class="nows">
                <li class="now"><span class="label">reading</span><span>glossy by marisa meltzer</span></li>
                <li class="now"><span class="label">working on</span><span>presentation mastery pathway, level 4, speech #1 @ milton escarpment toastmasters</span></li>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'resume' };
  }
  renderVals() {
    const d = new Date();
    const clock = (d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '') + '  ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })).toLowerCase();
    return Object.assign({ clock }, this.pageVals());
  }
  pageVals() {
    const t = this.state.tab;
    return {
      onResume: t === 'resume', onBeyond: t === 'beyond',
      resumeSel: String(t === 'resume'), beyondSel: String(t === 'beyond'),
      resumeBg: t === 'resume' ? '#FFFFF4' : '#E4E7C3', beyondBg: t === 'beyond' ? '#FFFFF4' : '#E4E7C3',
      showResume: () => this.setState({ tab: 'resume' }),
      showBeyond: () => this.setState({ tab: 'beyond' })
    };
  }
}
</script>

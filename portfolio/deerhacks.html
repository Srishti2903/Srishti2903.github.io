<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Srishti Gangolly — deerhacks</title>
<meta name="theme-color" content="#76BA9D">
<link rel="icon" href="img/doodle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Fraunces:ital,wght@1,800;1,900&amp;family=Pixelify+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#97051D}a:hover{color:#04361D}
.win{background:#F0F2D5;border:3px solid #04361D;box-shadow:6px 6px 0 #04361D;display:flex;flex-direction:column;min-width:0}
.bar{height:36px;flex:none;background:#04361D;color:#F0F2D5;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;font-family:'Pixelify Sans',monospace;font-size:16px;font-weight:600}
.close{width:28px;height:28px;box-sizing:border-box;border:2px solid #F0F2D5;background:#F0F2D5;display:inline-flex;align-items:center;justify-content:center}
.close:hover{background:#EF233C}
.label{font-family:'Pixelify Sans',monospace;font-size:14px;letter-spacing:.1em;color:#97051D}
.navrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:'Pixelify Sans',monospace;font-size:16px}
.navrow a{color:#04361D}
.px{image-rendering:pixelated;shape-rendering:crispEdges}
.hero{padding:30px 32px 26px;border-bottom:3px solid #04361D;background:#04361D;color:#F0F2D5;display:flex;flex-direction:column;gap:10px}
.hero a{color:#B9D3C4;font-family:'Pixelify Sans',monospace;font-size:15px;text-decoration:none}
.hero a:hover{color:#F0F2D5}
.hero h1{margin:0;font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:clamp(48px,6vw,76px);line-height:1;color:#F0F2D5}
.eyebrow{font-family:'Pixelify Sans',monospace;font-size:15px;letter-spacing:.08em;color:#F2B33D}
.sub{font-family:'Pixelify Sans',monospace;font-size:18px;font-weight:600}
.tabs{display:flex;gap:6px;padding:22px 32px 0}
.tab{font-family:'Pixelify Sans',monospace;font-size:17px;font-weight:600;color:#04361D;border:3px solid #04361D;border-bottom:0;padding:9px 20px;cursor:pointer;margin-bottom:-3px;position:relative}
.tab[aria-selected="true"]{z-index:1}
.tab:focus-visible{outline:3px solid #97051D;outline-offset:2px}
.sheet{margin:0 32px 32px;border:3px solid #04361D;background:#FFFFF4;padding:30px 32px 34px;display:flex;flex-direction:column;gap:12px}
.sec{margin:22px 0 2px;display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:26px;line-height:1.15;color:#6B0314}
.sec:first-child{margin-top:0}
.sec::before{content:"";flex:none;width:12px;height:12px;background:#EF233C;border:3px solid #04361D}
.body{margin:0;font-size:15px;line-height:1.8;max-width:760px}
.body strong{font-weight:500;background:linear-gradient(transparent 60%,#CFE6DA 60%)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:15px;line-height:1.7;max-width:760px}
.rows li{padding:8px 0 8px 20px;border-bottom:2px dashed rgba(4,54,29,.3);position:relative}
.rows li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;background:#EF233C}
.rows strong{font-weight:500;background:linear-gradient(transparent 60%,#CFE6DA 60%)}
.team{display:flex;flex-wrap:wrap;gap:8px}
.team a{font-family:'Pixelify Sans',monospace;font-size:14px;color:#04361D;text-decoration:none;padding:3px 10px;border:2px solid #04361D;background:#F0F2D5;box-shadow:2px 2px 0 #04361D}
.team a:hover{background:#04361D;color:#F0F2D5}
.stats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:#04361D;color:#F0F2D5;border:3px solid #04361D;box-shadow:3px 3px 0 #97051D;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:28px;line-height:1.1;color:#F2B33D}
.stat span{font-family:'Pixelify Sans',monospace;font-size:14px}
.badge{align-self:flex-start;font-family:'Pixelify Sans',monospace;font-size:15px;padding:4px 12px;background:#EF233C;color:#F0F2D5;border:2px solid #04361D;box-shadow:3px 3px 0 #04361D}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.pol{margin:0;background:#141414;border:3px solid #04361D;box-shadow:5px 5px 0 #97051D;padding:10px 10px 4px;transform:rotate(2deg);display:flex;flex-direction:column}
.pol img{display:block;width:100%;height:auto}
.pol figcaption{font-family:'Pixelify Sans',monospace;font-size:13px;color:#E4E7C3;text-align:center;padding:6px 0 7px}
.slot{box-sizing:border-box;border:3px dashed #04361D;background:repeating-linear-gradient(45deg,#F0F2D5 0 10px,#E8EBCB 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;font-family:'Pixelify Sans',monospace;font-size:13px;color:#2E5A43}
.slot svg{opacity:.8}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:640px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:6px}
.pair img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:3px solid #04361D;box-sizing:border-box;box-shadow:4px 4px 0 #97051D}
.pair figcaption{font-family:'Pixelify Sans',monospace;font-size:13px;text-align:center}
.reel{margin-top:6px;border:3px solid #04361D;background:#F0F2D5;box-shadow:4px 4px 0 #04361D;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.reel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:2px solid #04361D}
.reel-head b{font-family:'Pixelify Sans',monospace;font-size:17px}
.ig{font-family:'Pixelify Sans',monospace;font-size:14px;font-weight:700;text-decoration:none;color:#F0F2D5;background:#04361D;border:2px solid #04361D;padding:3px 10px;box-shadow:2px 2px 0 #97051D}
.ig:hover{background:#EF233C;color:#F0F2D5}
.strip-label{font-family:'Pixelify Sans',monospace;font-size:14px;color:#97051D;letter-spacing:.06em;margin-top:6px}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px}
.scroller img{flex:0 0 220px;width:220px;height:220px;object-fit:cover;scroll-snap-align:start;border:3px solid #04361D;box-sizing:border-box;background:#FFFFF4}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.posts img{display:block;width:100%;height:320px;object-fit:cover;object-position:top;border:3px solid #04361D;box-sizing:border-box;box-shadow:4px 4px 0 #04361D}
@media (max-width:700px){.posts,.pair{grid-template-columns:minmax(0,1fr)}}
.note{font-size:12px;color:#2E5A43}
.menubar{height:32px;flex:none;width:100%;box-sizing:border-box;background:#F0F2D5;border-bottom:3px solid #04361D;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:'Pixelify Sans',monospace;font-size:15px;position:sticky;top:0;z-index:6}
.menubar .menus{display:flex;align-items:center;gap:18px}
.menubar .menus a{color:#04361D;text-decoration:none;padding:2px 6px}
.menubar .menus a:hover{background:#04361D;color:#F0F2D5}
.menubar .tray{display:flex;align-items:center;gap:22px}
.crt{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(rgba(4,54,29,.05) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 140px rgba(4,54,29,.28)}
@media (max-width:700px){.menubar .menus .opt{display:none}}
@media (max-width:480px){.menubar{padding:0 10px;font-size:13px}.menubar .tray{gap:10px}.menubar .tray svg{width:14px;height:auto}}

/* phones: everything a little smaller and tighter; full-height blocks are scaled back up to fill the screen */
@media (max-width:560px){
  body{zoom:.88}
  footer [style*="gap: 12px; margin-top: 6px"]{justify-content:center}
  /* same footer on every page: no fixed heights */
  footer,footer > div{height:auto!important}
  [style*="min-height: 100vh"],.desk-root{min-height:calc(100dvh / .88)!important}
}
/* phones: no "back to desktop" link at the bottom */
@media (max-width:560px){
  .navrow a[href="desktop.html"],.navrow a[href="Home.dc.html"]{display:none}
}
</style>
<script src="js/srishti-os.js"></script>
</head>
<body>
<div id="app"></div>
<template id="page">
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; background-color: #76BA9D; background-image: radial-gradient(#6AAE91 1px, transparent 1.2px); background-size: 8px 8px; font-family: 'DM Mono', monospace; color: #04361D; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px 16px 0; position: relative">
  <header class="menubar" style="margin: -24px -16px 0; width: calc(100% + 32px)">
    <nav class="menus" aria-label="menu">
      <span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 6px">
        <svg class="px" viewBox="0 0 11 16" width="11" height="16" aria-hidden="true"><path fill="#EF233C" d="M2 0h1v1H2zM5 0h1v1H5zM8 0h1v1H8zM2 1h7v1H2zM2 2h7v3H2zM3 5h5v1H3zM4 6h3v1H4z"/><path fill="#97051D" d="M5 2h1v4H5zM8 2h1v3H8z"/><path fill="#04361D" d="M5 7h1v9H5zM1 9h1v2H1zM2 11h1v1H2zM3 12h2v1H3zM9 8h1v2H9zM8 10h1v1H8zM6 11h2v1H6z"/><path fill="#76BA9D" d="M2 9h1v2H2zM3 11h2v1H3zM8 8h1v2H8zM6 10h2v1H6z"/></svg>
        srishti os
      </span>
    </nav>
    <div class="tray">
      <svg class="px" viewBox="0 0 9 7" width="18" height="14" aria-label="wifi" role="img"><path fill="#04361D" d="M2 0h5v1H2zM1 1h1v1H1zM7 1h1v1H7zM0 2h1v1H0zM8 2h1v1H8zM3 2h3v1H3zM2 3h1v1H2zM6 3h1v1H6zM4 5h1v2H4z"/></svg>
      <svg class="px" viewBox="0 0 12 7" width="24" height="14" aria-label="battery full" role="img"><path fill="#04361D" d="M0 0h10v1H0zM0 6h10v1H0zM0 1h1v5H0zM9 1h1v5H9zM10 2h2v3h-2z"/><path fill="#EF233C" d="M2 2h6v3H2z"/></svg>
      <time style="white-space: pre; word-spacing: 2px">{{clock}}</time>
    </div>
  </header>

  <a href="desktop.html" aria-label="back to desktop" style="line-height: 0"><img loading="lazy" decoding="async" src="img/doodle.png" alt="Srishti Gangolly" style="width: 92px; height: auto; transform: rotate(6deg)"></a>

  <main class="win" style="width: 100%; max-width: 1080px">
    <div class="bar">
      <span>deerhacks.exe</span>
      <a class="close" href="projects.html" aria-label="close, back to projects"><svg class="px" viewBox="0 0 8 8" width="12" height="12" aria-hidden="true"><path fill="#04361D" d="M0 0h2v1H0zM6 0h2v1H6zM1 1h2v1H1zM5 1h2v1H5zM2 2h4v1H2zM3 3h2v2H3zM2 5h4v1H2zM1 6h2v1H1zM5 6h2v1H5zM0 7h2v1H0zM6 7h2v1H6z"/></svg></a>
    </div>
    <div style="padding: 6px 12px; border-bottom: 2px solid #04361D; font-size: 13px; background: #E4E7C3">~/srishti/projects/deerhacks</div>

    <header class="hero">
      <a href="projects.html">← back to projects</a>
      <span class="eyebrow">mlh-partnered hackathon · mcss</span>
      <h1>deerhacks</h1>
      <span class="sub">organizer · 2022 — 2024</span>
    </header>

    <div class="tabs" role="tablist" aria-label="deerhacks iterations">
      <button type="button" role="tab" class="tab" aria-selected="{{iiSel}}" style="background: {{iiBg}}" onClick="{{showII}}">deerhacks ii</button>
      <button type="button" role="tab" class="tab" aria-selected="{{iiiSel}}" style="background: {{iiiBg}}" onClick="{{showIII}}">deerhacks iii</button>
    </div>

    <div class="sheet" role="tabpanel">
      <!-- deerhacks ii -->
      <sc-if value="{{onII}}" hint-placeholder-val="{{ true }}">
        <h2 class="sec">overview</h2>
        <p class="body">the <strong>2nd iteration of the largest mlh-partnered hackathon</strong> hosted by the <strong>mathematical and computational sciences society</strong> at the <strong>university of toronto, mississauga</strong>, bringing together <strong>hundreds of students</strong> to build, learn, and compete.</p>

        <h2 class="sec">team</h2>
        <div class="team">
          <a href="https://www.linkedin.com/in/anthonytedja/">anthony tedja</a><a href="https://www.linkedin.com/in/crastars/">carina rastorgueva</a><a href="https://www.linkedin.com/in/harneet-channi/">harneet singh</a><a href="https://www.linkedin.com/in/hillarytang/">hillary tang</a><a href="https://www.linkedin.com/in/ivanvarquez/">ivan varquez</a><a href="https://www.linkedin.com/in/niralpatel02/">niral patel</a><a href="https://www.linkedin.com/in/ninaricci29/">nina ricci lu</a><a href="https://www.linkedin.com/in/shrey-vakil/">shrey vakil</a>
        </div>

        <div class="split">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <h2 class="sec">marketing &amp; brand strategy</h2>
            <ul class="rows">
              <li>coordinated <strong>marketing workflows</strong> across ui/ux, tech, and external teams to maintain <strong>consistent branding</strong> throughout the event.</li>
              <li>collaborated with <a href="https://www.linkedin.com/in/crastars/">carina rastorgueva</a> and <a href="https://www.linkedin.com/in/ivanvarquez/">ivan varquez</a> on <strong>brand strategy</strong>, <strong>content creation</strong>, and overall <strong>brand voice</strong>.</li>
            </ul>
            <h2 class="sec">social media &amp; outreach</h2>
            <ul class="rows">
              <li>built the <strong>instagram presence from zero to 450+ followers</strong>, producing content that drove outreach and participant sign-ups.</li>
              <li>created and promoted <strong>engaging content</strong> leading up to the event, boosting <strong>visibility</strong> and <strong>participant involvement</strong>.</li>
            </ul>
          </div>
          <figure class="pol" style="margin-top: 30px"><img loading="lazy" decoding="async" src="img/site/dh2-team.jpg" alt="the deerhacks ii organizing team"><figcaption>deerhacks ii team ♡</figcaption></figure>
        </div>

        <h2 class="sec">brand identity — from sketch to starry night</h2>
        <p class="body">what began as <strong>hand-drawn logo sketches</strong> exploring possible themes evolved into the final <strong>'starry night'</strong> concept.</p>
        <p class="body">early concepts explored a <strong>deer motif</strong>, a <strong>gaming controller</strong>, and a <strong>circular scenic badge</strong> — the final polished brand was brought to life digitally by <strong>ivan</strong>, translating rough paper concepts into a cohesive theme.</p>
        <div class="pair">
          <figure><img loading="lazy" decoding="async" src="img/site/dh2-sketch.jpg" alt="early logo sketches: deer, controller and circular badge concepts"><figcaption>early sketches · theme exploration</figcaption></figure>
          <figure><img loading="lazy" decoding="async" src="img/site/dh2-logo-final.jpg" alt="final deerhacks starry night logo"><figcaption>final logo · starry night</figcaption></figure>
        </div>

        <section class="reel" aria-label="content and campaigns on instagram">
          <div class="reel-head"><b>content &amp; campaigns · instagram</b><a class="ig" href="https://www.instagram.com/deerhacks/">instagram ↗</a></div>
          <span class="strip-label">2022 wrapped</span>
          <div class="scroller"><img loading="lazy" decoding="async" src="img/site/dh2-1.jpg" alt="instagram post: 2022 wrapped"><img loading="lazy" decoding="async" src="img/site/dh2-2.jpg" alt="instagram post: 150+ participants, 2 sponsors"><img loading="lazy" decoding="async" src="img/site/dh2-3.jpg" alt="instagram post: $5000+ in prizes, 13+ workshops"><img loading="lazy" decoding="async" src="img/site/dh2-4.jpg" alt="instagram post: 6+ club collaborations"></div>
          <span class="strip-label">registration &amp; faq</span>
          <div class="scroller"><img loading="lazy" decoding="async" src="img/site/dh2-5.jpg" alt="instagram post: registration is now open"><img loading="lazy" decoding="async" src="img/site/dh2-6.jpg" alt="instagram post: faq: eligibility criteria"><img loading="lazy" decoding="async" src="img/site/dh2-8.jpg" alt="instagram post: what's in my bag? deerhacks edition"></div>
          <span class="strip-label">mentor recruitment</span>
          <div class="scroller"><img loading="lazy" decoding="async" src="img/site/dh3-mentor-1.jpg" alt="mentor recruitment post: deerhacks is looking for mentors"><img loading="lazy" decoding="async" src="img/site/dh3-mentor-2.jpg" alt="mentor recruitment post: what do mentors do?"><img loading="lazy" decoding="async" src="img/site/dh3-mentor-3.jpg" alt="mentor recruitment post: who can be a mentor?"><img loading="lazy" decoding="async" src="img/site/dh3-mentor-4.jpg" alt="mentor recruitment post: interested?"></div>
          <span class="strip-label">volunteer recruitment</span>
          <div class="scroller"><img loading="lazy" decoding="async" src="img/site/dh3-vol-1.jpg" alt="volunteer recruitment post: deerhacks is looking for volunteers"><img loading="lazy" decoding="async" src="img/site/dh3-vol-2.jpg" alt="volunteer recruitment post: what can volunteers do?"><img loading="lazy" decoding="async" src="img/site/dh3-vol-3.jpg" alt="volunteer recruitment post: who can be a volunteer?"><img loading="lazy" decoding="async" src="img/site/dh3-vol-4.jpg" alt="volunteer recruitment post: interested?"></div>
        </section>
      </sc-if>

      <!-- deerhacks iii -->
      <sc-if value="{{onIII}}" hint-placeholder-val="{{ false }}">
        <h2 class="sec">overview</h2>
        <p class="body">the <strong>3rd iteration of the largest mlh-partnered hackathon</strong> hosted by the <strong>mathematical and computational sciences society</strong> at the <strong>university of toronto, mississauga</strong>.</p>
        <ul class="stats" aria-label="deerhacks iii highlights">
          <li class="stat"><b>1,500+</b><span>applicants</span></li>
          <li class="stat"><b>35+</b><span>events</span></li>
          <li class="stat"><b>$15K+</b><span>budget</span></li>
          <li class="stat"><b>+450</b><span>instagram</span></li>
          <li class="stat"><b>+870</b><span>linkedin</span></li>
        </ul>
        <span class="badge" style="margin-top: 6px">🏆 best event of the year</span>

        <h2 class="sec">team</h2>
        <div class="team">
          <a href="https://www.linkedin.com/in/a1t/">akira takaki</a><a href="https://www.linkedin.com/in/anthonytedja/">anthony tedja</a><a href="https://www.linkedin.com/in/crastars/">carina rastorgueva</a><a href="https://www.linkedin.com/in/ivanvarquez/">ivan varquez</a><a href="https://www.linkedin.com/in/jasmineguru/">jasmine guruparan</a><a href="https://www.linkedin.com/in/ninaricci29/">nina ricci lu</a><a href="https://www.linkedin.com/in/shiva-mulwani/">shiva mulwani</a><a href="https://www.linkedin.com/in/manojvis2001/">vishnu manoj</a>
        </div>

        <div class="split">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <h2 class="sec">partnerships &amp; outreach</h2>
            <ul class="rows">
              <li>acted as a <strong>main point of contact and spokesperson</strong> for the club, building strong connections with <strong>external partners and sponsors</strong>.</li>
              <li>collaborated with <a href="https://www.linkedin.com/in/manojvis2001/">vishnu manoj</a>, <a href="https://www.linkedin.com/in/jasmineguru/">jasmine guruparan</a>, and <a href="https://www.linkedin.com/in/ninaricci29/">nina ricci lu</a> on <strong>logistics and project management</strong> across all channels.</li>
            </ul>
            <h2 class="sec">marketing &amp; social media</h2>
            <ul class="rows">
              <li>created engaging <strong>linkedin content</strong> that grew the community to <strong>800+ followers</strong>, boosting visibility and online engagement leading up to the event.</li>
              <li>supported development of <strong>onboarding packages</strong> for hackers, mentors, volunteers, and judges to streamline orientation and ensure a smooth event-day experience alongside <a href="https://www.linkedin.com/in/ivanvarquez/">ivan</a> and <a href="https://www.linkedin.com/in/ninaricci29/">nina</a>.</li>
            </ul>
          </div>
          <div style="display: flex; flex-direction: column; gap: 22px; margin-top: 30px">
            <figure class="pol"><img loading="lazy" decoding="async" src="img/site/dh3-team-photo.jpg" alt="the deerhacks iii organizing team in matching deerhacks t-shirts under a purple #DareToGlow neon sign"><figcaption>deerhacks iii team ♡</figcaption></figure>
            <figure class="pol" style="transform: rotate(-2deg)"><img loading="lazy" decoding="async" src="img/site/dh3-team-2.jpg" alt="the full deerhacks iii team"><figcaption>the full crew</figcaption></figure>
          </div>
        </div>

        <div class="posts">
          <img loading="lazy" decoding="async" src="img/site/dh3-li-1.jpg" alt="deerhacks iii linkedin post: registrations open">
          <img loading="lazy" decoding="async" src="img/site/dh3-li-2.jpg" alt="deerhacks iii linkedin post: mentor recruitment">
          <img loading="lazy" decoding="async" src="img/site/dh3-li-3.jpg" alt="deerhacks iii linkedin post: volunteer recruitment">
        </div>
        <span class="note">name &amp; logo updated by current team</span>

        <h2 class="sec">events &amp; programming</h2>
        <ul class="rows">
          <li>took the lead in <strong>expanding and diversifying the workshop lineup</strong>, making the event more valuable and inclusive for participants across all experience levels.</li>
          <li>supported <strong>recruitment efforts</strong> for judges, mentors, and volunteers, ensuring a high-quality experience throughout the event.</li>
        </ul>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'ii' };
  }
  renderVals() {
    const d = new Date();
    const clock = (d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '') + '  ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })).toLowerCase();
    return Object.assign({ clock }, this.pageVals());
  }
  pageVals() {
    const t = this.state.tab;
    return {
      onII: t === 'ii', onIII: t === 'iii',
      iiSel: String(t === 'ii'), iiiSel: String(t === 'iii'),
      iiBg: t === 'ii' ? '#FFFFF4' : '#E4E7C3', iiiBg: t === 'iii' ? '#FFFFF4' : '#E4E7C3',
      showII: () => this.setState({ tab: 'ii' }),
      showIII: () => this.setState({ tab: 'iii' })
    };
  }
}
</script>

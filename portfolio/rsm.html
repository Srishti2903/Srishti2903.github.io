    <header class="hero">
      <a href="projects.html">← back to projects</a>
      <span class="eyebrow">ready, set, market · iba case competition</span>
      <h1>"heritage in a bottle:<br>beauty then, beauty now"</h1>
      <span class="sub">technology consultant · fall 2025</span>
    </header>

    <div class="sheet">
      <p class="intro"><em>ready, set, market</em> is utm's <strong>largest marketing case competition</strong>, hosted by the <strong>innovative business association</strong>. participants tackle a <em>real-world brand challenge</em> under time pressure, integrating <strong>research, strategy, and creativity</strong> into a compelling business recommendation.</p>

      <h2 class="sec">the challenge</h2>
      <p class="callout">how can <u>estée lauder</u> reposition itself as a <u>credible leader in modern skincare</u> while <u>preserving its luxury heritage</u>?</p>

      <h2 class="sec">the team</h2>
      <div class="team">
        <a class="mate" href="https://www.linkedin.com/in/parisphan/"><img src="img/site/rsm-paris.jpg" alt="paris phan"><span>paris phan</span></a>
        <a class="mate" href="https://www.linkedin.com/in/kiminguyen/"><img src="img/site/rsm-kim.jpg" alt="kim nguyen"><span>kim nguyen</span></a>
        <a class="mate me" href="https://www.linkedin.com/in/srishti-gangolly/"><img src="img/site/rsm-srishti.jpg" alt="srishti gangolly"><span>srishti gangolly</span></a>
        <a class="mate" href="https://www.linkedin.com/in/sandeepadas/"><img src="img/site/rsm-sandeepa.jpg" alt="sandeepa das"><span>sandeepa das</span></a>
      </div>

      <h2 class="sec">the analysis</h2>
      <p class="body">much like the tech industry, the <strong>beauty world is shifting</strong>. people still want <em>luxury</em> — but they also want to know <strong>what's in their products</strong> and <strong>why it works</strong>.</p>
      <p class="body">this tension between <em>heritage</em> and <em>modern transparency</em> is the insight that shaped our campaign.</p>

      <h2 class="sec">the campaign: beauty then, beauty now</h2>
      <p class="body">we took everything estée lauder has stood for across generations (<em>luxury, prestige, legacy</em>) and paired it with the <strong>science and transparency</strong> today's consumers expect. we brought it to life in three ways:</p>
      <div class="pillars">
        <div class="pillar"><b>01</b><div><h3>multigenerational storytelling</h3><p>showing how the brand has stayed <strong>relevant across generations</strong> of women through <em>authentic narrative</em>.</p></div></div>
        <div class="pillar"><b>02</b><div><h3>experiential pop-ups</h3><p>letting people <strong>experience the brand in person</strong> — moving beyond digital into <em>tangible, memorable touchpoints</em>.</p></div></div>
        <div class="pillar"><b>03</b><div><h3>personalized skincare quiz</h3><p>helping customers find <strong>products that actually work for them</strong> through <em>data-driven personalization</em>.</p></div></div>
      </div>

      <div class="outcome-head">
        <h2 class="sec" style="margin: 0">the outcome</h2>
        <a class="deck" href="https://srishtigangolly.com/docs/rsm-deck.pdf">view full deck ↗</a>
      </div>
      <p class="outcome">a campaign that reimagines estée lauder's heritage through <strong>emotional storytelling</strong>, <strong>scientific transparency</strong>, and a <strong>more personal digital experience</strong> — without losing what made the brand <strong>iconic</strong>.</p>

      <h2 class="sec">my contribution · technology consultant</h2>
      <p class="quiz-title">"a formula for you" <em>quiz</em></p>
      <p class="tagline">your skin, your way.</p>
      <p class="body">designed and led a <strong>personalized digital experience</strong> that provides <em>unique skincare routine recommendations</em> based on preferences — with <strong>digestible, consumer-friendly ingredient information</strong> built in.</p>
      <p class="body">applied <strong>product management principles</strong> and <strong>audience segmentation</strong> to redesign the website journey, aligning the experience with <em>sales, marketing, and customer needs</em>.</p>

      <div class="grid2" style="margin-top: 8px">
        <div class="mock" aria-label="mockup of the estée lauder skincare menu with the routine finder highlighted">
          <div class="mock-bar">current state · nav menu</div>
          <div style="background: #141c28; padding: 4px 14px; text-align: center; border-bottom: 1px solid #2a3040; font-size: 9px; color: #8a9ab0">12-piece holiday blockbuster &nbsp;<u style="color: #c9a84c">shop now</u></div>
          <div class="row" style="font-size: 11px; color: #fff"><span>ESTĒE LAUDER</span><span class="gold" style="font-size: 9px">SIGN IN</span></div>
          <div class="row" style="background: #141c28"><span>‹ SKINCARE</span></div>
          <div style="padding: 9px 14px; border: 1.5px solid #c9a84c; margin: 6px 10px 2px; border-radius: 4px; background: #141c28; font-size: 10px; letter-spacing: .1em; color: #c9a84c">SKINCARE ROUTINE FINDER</div>
          <div class="row"><span>SHOP ALL SKINCARE</span></div>
          <div class="row"><span>BY CATEGORY</span><span>›</span></div>
          <div class="row"><span>BY CONCERN</span><span>›</span></div>
          <div class="row"><span>COLLECTIONS</span><span>›</span></div>
          <div class="row" style="border: 0"><span>FEATURED</span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <span class="label">the redesign rationale</span>
          <div class="mini"><b>01</b><div><h4>better visibility</h4><p>moved from a <strong>buried nav dropdown</strong> to a <strong>featured homepage experience</strong>.</p></div></div>
          <div class="mini"><b>02</b><div><h4>accessibility</h4><p>clear entry points for both <strong>new</strong> and <strong>returning customers</strong>.</p></div></div>
          <div class="mini"><b>03</b><div><h4>better engagement</h4><p>personalized journeys drive <strong>higher retention time</strong> on the site and convert more <strong>browsers into buyers</strong>.</p></div></div>
        </div>
      </div>

      <span class="label" style="margin-top: 14px">the segmented experience</span>
      <div class="grid-phone">
        <div class="pillars">
          <div class="pillar"><b>01</b><div><h3>new customers</h3><p>encouraged to take a <strong>quiz</strong> to understand their <strong>skin concerns</strong> and receive a <strong>tailored routine</strong>.</p></div></div>
          <div class="pillar"><b>02</b><div><h3>positive experience</h3><p>get a personalized <strong>"year in review,"</strong> <strong>product recommendations</strong>, and an easy <strong>repurchase option</strong>.</p></div></div>
          <div class="pillar"><b>03</b><div><h3>negative experience</h3><p>prompted to <strong>retake the quiz</strong> and receive <strong>new skincare recommendations</strong>.</p></div></div>
        </div>

        <div class="phone-wrap">
          <div class="phone" aria-label="clickable prototype of the a formula for you quiz">
            <div class="screen">
              <div class="notch"><i></i></div>

              <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
                <div class="scr">
                  <div style="display: flex; justify-content: space-between"><span class="brand">estée<br>lauder</span><span style="width: 12px; height: 12px; border: 1.5px solid #c9a84c; border-radius: 2px"></span></div>
                  <p class="brand" style="text-align: center; margin: 22px 0 8px; font-size: 8.5px">a formula for you</p>
                  <p class="eh" style="font-size: 22px; text-align: center; margin: 0 0 10px">your skin.<br>your way.</p>
                  <p class="small" style="text-align: center; margin: 0">discover your personalized routine, crafted with over 75 years of skincare expertise.</p>
                  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
                    <button class="cta" type="button" onClick="{{goQ1}}">begin your skin consultation</button>
                    <button class="cta" type="button" style="border-color: rgba(201,168,76,.38)" onClick="{{goReturning}}">returning customer</button>
                  </div>
                  <p class="small" style="text-align: center; margin: 9px 0 0; font-size: 7.5px; color: #4a5568">dermatologist tested · expert formulated</p>
                </div>
              </sc-if>

              <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ false }}">
                <div class="scr">
                  <span class="brand" style="font-size: 8.5px">skin consultation</span>
                  <div class="prog"><i class="{{p1}}"></i><i class="{{p2}}"></i><i class="{{p3}}"></i></div>

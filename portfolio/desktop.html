body{margin:0}

.icon span{font-family:'Pixelify Sans',monospace;font-size:14px;line-height:1.2;text-align:center;padding:2px 4px;background:rgba(240,242,213,.88)}
.icon:hover span,.icon:focus span{background:#04361D;color:#F0F2D5}
.icon:hover svg{transform:translateY(-2px)}
.icon:active{cursor:grabbing}
.icon svg{pointer-events:none}
.screen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:32px;align-items:center;width:100%;max-width:1280px;flex:1;min-height:0}
.icons{display:grid;grid-template-columns:repeat(2,104px);gap:20px 8px;align-content:center}
@media (max-width:900px){

  .icons{grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center}
  .spacer{display:none}
}
@media (max-width:560px){

  .icon{width:100%}
  .icon span{font-size:13px;overflow-wrap:anywhere}
  .win h2{font-size:34px!important}
}
@media (max-width:900px){.icon{touch-action:auto;cursor:pointer}}
.px{image-rendering:pixelated;shape-rendering:crispEdges}
.menubar{height:32px;flex:none;width:100%;box-sizing:border-box;background:#F0F2D5;border-bottom:3px solid #04361D;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:'Pixelify Sans',monospace;font-size:15px;position:relative;z-index:2}
.menubar .menus{display:flex;align-items:center;gap:18px}
.menubar .menus a{color:#04361D;text-decoration:none;padding:2px 6px}
.menubar .menus a:hover{background:#04361D;color:#F0F2D5}
.menubar .tray{display:flex;align-items:center;gap:22px}
.crt{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(rgba(4,54,29,.05) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 140px rgba(4,54,29,.28)}
.menubar .menus{margin:0 auto 0 12px;min-width:0}
.menubar .menus a,.menubar .brand,.menubar time{white-space:nowrap}
@media (max-width:1100px){.menubar .menus{gap:6px}.menubar .tray{gap:14px}}
/* tablets and phones: tabs get their own scrollable row under the menu bar */
@media (max-width:860px){

  .menubar .brand{order:1}

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let spots = {};
    try { spots = JSON.parse(localStorage.getItem('srishti-os-icons-v2') || '{}'); } catch (e) {}
    this.state = { now: new Date(), spots, lifted: null };
    this.dragged = false;
    setInterval(() => this.setState({ now: new Date() }), 30000);
  }
  // drag an icon to a new spot; a press without movement still opens it
  grab(i, e) {
    if (e.button !== 0 || e.pointerType === 'touch') return;
    const el = e.currentTarget;
    const scale = el.getBoundingClientRect().width / el.offsetWidth || 1;
    const from = this.state.spots[i] || { x: 0, y: 0 };
    const x0 = e.clientX, y0 = e.clientY;
    // keep the icon inside the desktop, below the menu bar
    const r = el.getBoundingClientRect(), d = el.closest('.desk-root').getBoundingClientRect();
    const lim = { x0: (d.left + 4 - r.left) / scale, x1: (d.right - 4 - r.right) / scale, y0: (d.top + 44 - r.top) / scale, y1: (d.bottom - 4 - r.bottom) / scale };
    const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
    this.dragged = false;
    const move = (ev) => {
      const dx = clamp((ev.clientX - x0) / scale, lim.x0, lim.x1), dy = clamp((ev.clientY - y0) / scale, lim.y0, lim.y1);
      if (!this.dragged && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 4) return;
      this.dragged = true;
      this.setState({ lifted: i, spots: Object.assign({}, this.state.spots, { [i]: { x: from.x + dx, y: from.y + dy } }) });
    };
    const drop = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', drop);
      // a plain click must not re-render, or the link is swapped out before it opens
      if (!this.dragged) return;
      this.setState({ lifted: null });
      try { localStorage.setItem('srishti-os-icons-v2', JSON.stringify(this.state.spots)); } catch (err) {}
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', drop);
  }
  tap(e) {
    if (this.dragged) { e.preventDefault(); this.dragged = false; }
  }
  renderVals() {
    const d = this.state.now;
    const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const vals = { clock: (day + '  ' + time).toLowerCase() };
    for (let i = 0; i < 7; i++) {
      const p = this.state.spots[i];
      vals['t' + i] = p ? 'translate(' + Math.round(p.x) + 'px, ' + Math.round(p.y) + 'px)' : 'none';
      vals['z' + i] = this.state.lifted === i ? '4' : p ? '2' : 'auto';
      vals['grab' + i] = (e) => this.grab(i, e);
      vals['tap' + i] = (e) => this.tap(e);
    }
    return vals;
  }
}
</script>
